<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LawFlow 智律工作台 · 私有化法律大模型办案系统</title>
  <link rel="stylesheet" href="./css/style.css">
  <script src="./vendor/purify.min.js"></script>
  <script type="module" src="./js/main.js"></script>
</head>
<body>

  <body>

  <!-- ========================================================================
       左侧固定窄导航栏 (220px, 宪章深蓝)
       ======================================================================== -->
  <aside class="sidebar">
    <div>
      <!-- 品牌区 -->
      <div class="brand-section">
        <div class="brand-badge">
          <div class="brand-icon-box">
            <!-- 天平矢量图标 -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3v18"></path>
              <path d="M4 7h16"></path>
              <path d="M4 7l-2 7h6l-2-7"></path>
              <path d="M20 7l-2 7h6l-2-7"></path>
              <path d="M6 21h12"></path>
            </svg>
          </div>
          <div class="brand-title-wrap">
            <div class="brand-main-title">LAWFLOW <span class="sub">智律</span></div>
            <div class="brand-sub-caption">中国执业律师私有化办案系统</div>
          </div>
        </div>
      </div>

      <!-- 四大执业模块导航 -->
      <nav class="nav-list">
        <button class="nav-item active" id="nav-calc" onclick="switchNavTab('tab-calc', '01 实务精算与核验', this)">
          <!-- 精算/矩阵图标 -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="2" width="16" height="20" rx="2"></rect>
            <line x1="8" y1="6" x2="16" y2="6"></line>
            <line x1="16" y1="14" x2="16" y2="18"></line>
            <path d="M8 10h.01"></path>
            <path d="M12 10h.01"></path>
            <path d="M16 10h.01"></path>
            <path d="M8 14h.01"></path>
            <path d="M12 14h.01"></path>
            <path d="M8 18h.01"></path>
            <path d="M12 18h.01"></path>
          </svg>
          <span>01 实务精算与核验</span>
        </button>

        <button class="nav-item" id="nav-litigation" onclick="switchNavTab('tab-litigation', '02 立案文书流水线', this)">
          <!-- 卷宗/文档图标 -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          <span>02 立案文书流水线</span>
        </button>

        <button class="nav-item" id="nav-evidence" onclick="switchNavTab('tab-evidence', '03 证据清洗与庭审', this)">
          <!-- 法槌/盾牌图标 -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <path d="M12 18v-6"></path>
            <path d="M9 15h6"></path>
          </svg>
          <span>03 证据清洗与庭审</span>
        </button>

        <button class="nav-item" id="nav-rag-sign" onclick="switchNavTab('tab-rag-sign', '04 类案分歧与二审翻盘', this)">
          <!-- 签署/检索图标 -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
          </svg>
          <span>04 类案分歧与二审翻盘</span>
        </button>

        <button class="nav-item" id="nav-deep-matrix" onclick="switchNavTab('tab-deep-matrix', '05 要件推演与执行破局', this)">
          <!-- 天平/要件图谱图标 -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
          <span>05 要件推演与执行破局</span>
        </button>

        <button class="nav-item" id="nav-statutes" onclick="switchNavTab('tab-statutes', '06 法条库与子母法图谱', this)">
          <!-- 法典/图谱书籍图标 -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            <line x1="8" y1="7" x2="16" y2="7"></line>
            <line x1="8" y1="11" x2="14" y2="11"></line>
          </svg>
          <span>06 法条库与子母法图谱</span>
        </button>

        <button class="nav-item" id="nav-graphs" onclick="switchNavTab('tab-graphs', '07 案件空间与核心图谱中枢', this)">
          <!-- 核心图谱 / 空间中枢图标 -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
            <path d="M10 6.5h4M6.5 10v4M17.5 10v4M10 17.5h4"></path>
          </svg>
          <span>07 案件空间与核心图谱</span>
        </button>

        <button class="nav-item" id="nav-copilot" onclick="switchNavTab('tab-copilot', '08 智律 AI 语音中枢', this)">
          <!-- AI 语音中枢麦克风与声波图标 -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">


  <div class="main-wrapper">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
          <span>08 智律 AI 语音中枢</span>
        </button>
      </nav>
    </div>

    <!-- 底部服务在线呼吸灯与折叠状态指示器 -->
    <div class="sidebar-footer">
      <div role="button" tabindex="0"  class="status-summary-btn" onclick="openEngineSettingsModal()" title="点击配置或切换大模型引擎 (云端API / 本地Ollama)">
        <span class="pulse-dot" id="sidebar-pulse-dot"></span>
        <span id="sidebar-status-text">检测引擎状态中...</span>
      </div>

      <!-- 悬停弹层显示具体服务状态 -->
      <div class="status-popover">
        <div class="popover-item">
          <span>AI 推理引擎</span>
          <span class="popover-status" id="popover-ai-status">探针检测中...</span>
        </div>
        <div class="popover-item">
          <span>文书排版引擎</span>
          <span class="popover-status">Stirling-PDF / 本地引擎</span>
        </div>
        <div class="popover-item">
          <span>电子存证签章</span>
          <span class="popover-status">DocuSeal 存证链</span>
        </div>
        <div role="button" tabindex="0"  class="popover-item" style="color: var(--accent-amber); font-size: 10.5px; margin-top: 5px; cursor: pointer;" onclick="openEngineSettingsModal()">
          <span>⚙ 点击打开模型引擎与分发配置</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- ========================================================================
       主工作区容器
       ======================================================================== -->
  <main class="main-content">
    
    <!-- 顶部工作区标头 -->
    <header class="top-header">
      <div class="header-breadcrumb">
        <button type="button" class="sidebar-toggle-btn" onclick="toggleSidebar()" title="折叠/展开侧边栏">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <span class="module-badge" id="current-module-badge">模块 01</span>
        <span class="current-title" id="current-module-title">实务精算与核验</span>
      </div>
      <div class="header-meta" style="display: flex; align-items: center; gap: 8px;">
        <span class="badge" id="header-pii-tag" style="background:#ECFDF5; color:#059669; border:1px solid #A7F3D0; font-size:11px; padding:3px 8px; display:inline-flex; align-items:center; gap:4px;" title="本地 PII 隐私脱敏与还原网关已激活（云端零明文泄露）">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
          <span>本地PII脱敏盾在线</span>
        </span>
        <span id="current-date-text">2026年10月16日</span>
        <button type="button" class="btn btn-amber btn-sm" onclick="toggleGlobalVoiceDrawer()" style="padding: 4px 10px; font-size: 11.5px; display: inline-flex; align-items: center; gap: 5px;" title="呼出全局 AI 语音副驾（可在当前模块边看边口述）">
          <span class="pulse-dot" style="background:#22c55e; width:7px; height:7px;"></span>
          <span>🎙️ AI 语音副驾</span>
        </button>
        <button type="button" class="btn btn-secondary btn-sm" onclick="openFileConverterModal()" style="padding: 4px 10px; font-size: 11.5px; background: #FFFFFF; border: 1px solid var(--border-hairline); color: var(--primary-navy); cursor: pointer; display: inline-flex; align-items: center; gap: 5px;" title="司法离线全格式转码箱 (Filee 协同 · 支持 HEIC/录音/PDF/表格)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><path d="M12 18v-6"></path><path d="M9 15h6"></path></svg>
          <span id="header-converter-tag">⚖️ 离线转码箱</span>
        </button>
        <button type="button" class="btn btn-secondary btn-sm" onclick="openEngineSettingsModal()" style="padding: 4px 10px; font-size: 11.5px; background: #FFFFFF; border: 1px solid var(--border-hairline); color: var(--primary-navy); cursor: pointer; display: inline-flex; align-items: center; gap: 5px;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          <span id="header-engine-mode-tag">模型引擎配置</span>
        </button>
      </div>
    </header>

    <!-- ======================================================================
         全局当前在办案件上下文总线 (Global Case Context Bus)
         打通 01精算、02文书、03庭审、05要件、06法典模块孤岛
         ====================================================================== -->
    <div class="global-case-bar" id="global-case-bar">
      <div class="case-info-group">
        <button type="button" class="btn-dispatch" style="background:#14233C; color:#FFFFFF; border:none; padding:4px 10px; font-weight:700; display:inline-flex; align-items:center; gap:5px;" onclick="openMatterVaultModal()" title="切换或管理案件独立空间 (Matter Vault)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
          <span>📁 空间: <span id="current-matter-tag-name">某数据借款纠纷</span> ▾</span>
        </button>
        <div class="case-tag-cause" id="gcase-cause-badge">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
          <span id="gcase-cause">民间借贷纠纷</span>
        </div>
        <div role="button" tabindex="0"  class="case-title-text" id="gcase-title-display" onclick="openCaseContextModal()" title="点击查看/编辑在办案件全局信息与事实">
          <span id="gcase-title">未选择案件</span>
          <span id="gcase-demo-badge" style="display:none; margin-left:8px; font-size:11px; color:#B45309; background:#FEF3C7; padding:2px 8px; border-radius:4px;">演示数据</span>
          <button type="button" id="gcase-clear-demo-btn" style="display:none; margin-left:6px;" class="btn btn-secondary btn-sm" onclick="clearDemoDataUI()">清空演示数据</button>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
        </div>
        <div class="case-parties-pill" id="gcase-parties-display">
          <span>原告: <strong id="gcase-plaintiff" style="color:var(--primary-navy);">李四</strong></span>
          <span style="color:#C58532; font-weight:700;">VS</span>
          <span>被告: <strong id="gcase-defendant" style="color:var(--primary-navy);">张三</strong></span>
          <span style="color:var(--text-muted);">|</span>
          <span>标的: <strong id="gcase-amount" style="color:var(--primary-navy); font-family:var(--font-mono);">¥500,000.00</strong></span>
        </div>
      </div>

      <div class="case-slates-group">
        <div role="button" tabindex="0"  class="case-slate-badge" id="gcase-slate-calc" onclick="switchNavTab('tab-calc', '01 实务精算与核验', document.getElementById('nav-calc'))" title="点击查看已核算的利息与诉讼费明细">
          <span>🧮</span>
          <span id="gcase-calc-summary">精算: 利息¥26,701 · 诉讼费¥8,800</span>
        </div>
        <div role="button" tabindex="0"  class="case-slate-badge active" id="gcase-slate-statutes" onclick="openSelectedStatutesDrawer()" title="点击查看已从06法典库选入的请求权法条清单">
          <span>⚖️</span>
          <span id="gcase-statutes-summary">请求权依据: 3 条</span>
        </div>
        <div role="button" tabindex="0"  class="case-slate-badge" id="gcase-slate-evidence" onclick="switchNavTab('tab-evidence', '03 证据清洗与庭审', document.getElementById('nav-evidence'))" title="点击前往证据清洗清单">
          <span>📑</span>
          <span id="gcase-evidence-summary">证据材料: 3 份</span>
        </div>
      </div>

      <div class="case-actions-group">
        <button type="button" class="btn-dispatch" style="border-color: #D32F2F; color: #D32F2F; background: #FFF5F5;" onclick="openConflictCheckModal()" title="排查在办与历史委托人利益冲突（《律师法》第39条红线审查）">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
          <span id="gcase-conflict-btn-text">🛡️ 利冲穿透排查</span>
        </button>
        <button type="button" class="btn-dispatch" style="border-color: #1976D2; color: #1976D2; background: #E3F2FD;" onclick="openCitationGuardReportModal()" title="大模型文书本地库比对引注熔断排查器与自动净化工作台">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          <span>⚡ 本地库比对引注熔断</span>
        </button>
        <button type="button" class="btn-dispatch amber-action" onclick="applyCaseContextToLitigation(false)" title="将当前案件当事人、标的、利息公文与选定法条一键注入 02 起诉状表单">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
          <span>一键注入02立案文书</span>
        </button>
        <button type="button" class="btn-dispatch" onclick="applyCaseContextToDeepMatrix()" title="将当前案情与证据带入 05 模块，启动七维要件事实推演">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
          <span>推演至05要件事实</span>
        </button>
        <button type="button" class="btn-dispatch" onclick="openCaseContextModal()" title="查看/编辑全局案件工作卡或重置案件">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          <span>案件工作卡</span>
        </button>
      </div>
    </div>


    <main class="main-content">
      <section id="tab-calc" class="workspace-tab active" role="tabpanel" aria-labelledby="nav-calc"></section>
      <section id="tab-litigation" class="workspace-tab" role="tabpanel" aria-labelledby="nav-litigation"></section>
      <section id="tab-evidence" class="workspace-tab" role="tabpanel" aria-labelledby="nav-evidence"></section>
      <section id="tab-rag-sign" class="workspace-tab" role="tabpanel" aria-labelledby="nav-rag-sign"></section>
      <section id="tab-deep-matrix" class="workspace-tab" role="tabpanel" aria-labelledby="nav-deep-matrix"></section>
      <section id="tab-statutes" class="workspace-tab" role="tabpanel" aria-labelledby="nav-statutes"></section>
      <section id="tab-graphs" class="workspace-tab" role="tabpanel" aria-labelledby="nav-graphs"></section>
      <section id="tab-copilot" class="workspace-tab" role="tabpanel" aria-labelledby="nav-copilot"></section>
    </main>
  </div>

  <!-- 全局模态框挂载根节点 -->
  <div id="modal-root"></div>

  <!-- 轻量级 Toast 提示常驻容器 -->
  <div class="toast-container" id="toast-container" role="status" aria-live="polite"></div>

</body>
</html>
