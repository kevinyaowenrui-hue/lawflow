[pytest]
testpaths = tests
addopts = -q --strict-markers
xfail_strict = true
filterwarnings =
    error::DeprecationWarning
    ignore:.*starlette\.testclient.*:
    ignore:.*httpx.*:
markers =
    slow: long-running coverage gate / integration checks
    requires_ollama: needs local Ollama at 127.0.0.1:11434
    requires_soffice: needs LibreOffice soffice on PATH or install dir
